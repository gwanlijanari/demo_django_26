{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <header>
        <img src="" alt="" class="logo" />

        <div class="profile" style="position: relative;">
          <h1>{{ user.student.surname }} {{ user.student.name.0 }}.</h1>
          <div
            class="pfp"
          >
            <a href="{% url 'accounts:profile' %}">{{ user.student.surname.0 }}{{ user.student.name.0 }}</a>
          </div>
            
          <div class="drop" onclick="document.getElementById('menu').style.display = 'block'">
            &#9660;
          </div>
          <div
            id="menu"
            style="
              display: none;
              position: absolute;
              background: white;
              border: #93abbc 1px solid;
              top:85px;
              right:0;
            "
            onmouseleave="this.style.display = 'none'"
          >
            <form method="post" action="{% url 'accounts:logout' %}">
              {% csrf_token %}
              <button type="submit">Выйти</button>
            </form>
            <a href="/admin/"><button>Админка</button></a>
          </div>
        </div>
</header>
    <main>
      <div class="slider-container">
        <div class="slider-track" id="slider-track">
          <div class="slide">Слайд 1</div>
          <div class="slide">Слайд 2</div>
          <div class="slide">Слайд 3</div>
        </div>
      </div>
    </main>

    <script>
      const track = document.getElementById("slider-track");
      const slides = document.querySelectorAll(".slide");

      let currentIndex = 0;
      const slideWidth = slides[0].offsetWidth;

      function nextSlide() {
        currentIndex++;
        if (currentIndex >= slides.length) {
          currentIndex = 0; // Возврат к началу, если слайды закончились
        }
        updateSlider();
      }

      // Функция обновления позиции
      function updateSlider() {
        track.style.transform = `translateX(${-currentIndex * slideWidth}px)`;
      }

      // === АВТОМАТИЧЕСКАЯ ПРОКРУТКА ===
      // Время указано в миллисекундах (3000 мс = 3 секунды)
      let autoPlayTimer = setInterval(nextSlide, 3000);
    </script>
  </body>
</html>
