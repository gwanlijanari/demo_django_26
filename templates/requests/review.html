<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Отзыв</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=6" />
  </head>
  <body>
    {% include 'header.html' %}
    <main>
      <a href="{% url 'accounts:profile' %}" class="arrow_back">⬅️</a>
      <h1>Оставить отзыв</h1>

      <form method="post" class="reviev_post">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit">Отправить</button>
      </form>

      {% if existing_review %}
      <div class="previous_review">
        <h3>Ваш прошлый отзыв</h3>
        <p>{{ existing_review.value }}</p>
      </div>
      {% endif %}
    </main>
  </body>
</html>
