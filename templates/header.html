    <header>
      <a href="{% url 'index' %}" class="logo"
        ><img src="/static/images/image05.jpg" alt="" class="logo"
      /></a>
      <div class="profile" style="position: relative">
        <h1>{{ user.student.surname }} {{ user.student.name.0 }}.</h1>
        <div class="pfp">
          <a href="{% url 'accounts:profile' %}"
            >{{ user.student.surname.0 }}{{ user.student.name.0 }}</a
          >
        </div>

        <div
          class="drop"
          onclick="document.getElementById('menu').style.display = 'block'"
        >
          &#9660;
        </div>
        <div
          id="menu"
          style="
            display: none;
            position: absolute;
            background: white;
            border: #93abbc 1px solid;
            top: 85px;
            right: 0;
          "
          onmouseleave="this.style.display = 'none'"
        >
          <form method="post" action="{% url 'accounts:logout' %}">
            {% csrf_token %}
            <button type="submit">Выйти</button>
          </form>
        </div>
      </div>
    </header>
